<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Detail User</title>
</head>
<body>
    <h1>Detail User</h1>

    <p>ID: {{ user.id }}</p>

    <p>Nama belakang: {{ user.last_name }}</p>

    <a href="/users/">Kembali ke daftar user</a>
</body>
</html>
