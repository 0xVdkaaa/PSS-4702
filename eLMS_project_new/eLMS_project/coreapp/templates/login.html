<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - eLMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h3 class="text-primary fw-bold">Login eLMS</h3>
                            <p class="text-muted small">Silakan masuk menggunakan akun Anda</p>
                        </div>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Masukkan username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                            </div>
                            
                            <!-- Tombol Masuk -->
                            <button type="submit" class="btn btn-primary w-100 fw-bold mb-2">Masuk</button>
                            
                            <!-- Tombol Kembali ke Beranda -->
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary w-100 fw-bold">Kembali ke Halaman Utama</a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
