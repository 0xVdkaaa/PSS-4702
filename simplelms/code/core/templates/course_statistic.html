<!DOCTYPE html>
<html>
<head><title>Statistik Course</title></head>
<body>
  <h1>Statistik Course</h1>
  <table border="1" cellpadding="6" cellspacing="0">
    <tr><th>Course</th><th>Pengajar</th><th>Member</th><th>Konten</th><th>Komentar</th></tr>
    {% for c in courses %}
    <tr><td>{{ c.name }}</td><td>{{ c.teacher.username }}</td>
        <td>{{ c.jumlah_member }}</td><td>{{ c.jumlah_konten }}</td>
        <td>{{ c.jumlah_komentar }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
